onboarding = false

[experimental]
kitty_graphics = true

[theme.custom]
accent = "#b3e1a7"          # active tab, borders
surface0 = "#1e1e2d"        # inactive tabs
panel_bg = "#1e1e2d"        # tab bar, popups
sidebar_bg = "#181824"      # sidebar
active_row_bg = "#1e1e2d"   # active sidebar row

[keys]
prefix = "ctrl+space"       # herdr default: ctrl+b
# On macOS, turn off ctrl+space for "Select the previous input source" in
# System Settings > Keyboard > Keyboard Shortcuts > Input Sources (see README).

# Cycle panes in order, wrapping. alt+shift+left/right need no prefix.
cycle_pane_next = ["prefix+right", "alt+shift+right"]
cycle_pane_previous = ["prefix+left", "alt+shift+left"]

# Tabs (herdr defaults prefix+n / prefix+p dropped). ctrl+tab / ctrl+shift+tab need no
# prefix; Ghostty's own binding of those keys is removed in the Ghostty config.
next_tab = ["prefix+tab", "prefix+shift+right", "ctrl+tab"]
previous_tab = ["prefix+shift+tab", "prefix+shift+left", "ctrl+shift+tab"]
new_tab = "prefix+plus"     # herdr default: prefix+c

# Detach on prefix+d, as in tmux (herdr default: prefix+q).
detach = "prefix+d"

# prefix+o is taken by annotate.last-newest below, so release herdr's default
# open_notification_target (jump to the latest notification's pane).
open_notification_target = ""

# Workspaces, in sidebar order. alt+shift+up/down need no prefix.
previous_workspace = ["prefix+up", "alt+shift+up"]
next_workspace = ["prefix+down", "alt+shift+down"]

# Resize the focused pane in one keystroke (hold to repeat), with no resize mode to leave.
# Plain alt/ctrl/shift+arrows are taken by Ghostty word-jump, macOS Spaces and selection.
resize_pane_left = "ctrl+shift+left"
resize_pane_down = "ctrl+shift+down"
resize_pane_up = "ctrl+shift+up"
resize_pane_right = "ctrl+shift+right"

# New pane in a fixed shape: the first split goes right, later ones stack down the
# right-hand column, leaving the left pane alone (scripts/split-pane.sh). herdr's own
# prefix+v / prefix+minus still split the focused pane either way.
[[keys.command]]
key = "prefix+n"
type = "shell"
command = 'bash "$HOME/.config/herdr/scripts/split-pane.sh" >/dev/null'
description = "new pane (right, then stacked on the right)"

# Side panes, placed the same way. Waiting for the prompt stops the command echoing twice,
# and the new pane's shell expands $AI_AGENT.
[[keys.command]]
key = "prefix+i"
type = "shell"
command = '''
p=$(bash "$HOME/.config/herdr/scripts/split-pane.sh")
herdr pane wait-output "$p" --regex '\S' --timeout 5000 >/dev/null
herdr pane run "$p" ipython
'''
description = "ipython in a side pane"

[[keys.command]]
key = "prefix+c"
type = "shell"
command = '''
p=$(bash "$HOME/.config/herdr/scripts/split-pane.sh")
herdr pane wait-output "$p" --regex '\S' --timeout 5000 >/dev/null
herdr pane run "$p" '$AI_AGENT'
'''
description = "coding agent in a side pane"

# Herdr Annotate (Full) — document review with plannotator-tui. annotate.open and the Lite-style
# annotation keys are intentionally unbound. prefix+o was freed above.
[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "pick one of the agent's recent replies to review"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"

# Reconnect saved SSH machines stuck on "! auth" (passphrase prompt in a popup)
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "bash $HOME/.config/herdr/scripts/reconnect-machines.sh"
description = "reconnect machines that need SSH authentication"
